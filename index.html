<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <title>M20 — Learning Index</title>
    <meta
      name="description"
      content="M20 Learning Index — a structured reference index of engineering project specifications with full build phases, bill of materials, validation checklists and downloadable PDF spec sheets."
    />
    <meta name="theme-color" content="#102a43" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('m20_theme') || 'system';
          var dark =
            t === 'dark' ||
            (t === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.add(dark ? 'dark' : 'light');
        } catch (e) {
          document.documentElement.classList.add('light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
